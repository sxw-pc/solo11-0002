[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-lab"
version = "0.1.0"
description = "本地 Web 漏洞扫描器与故意有漏洞的靶场（仅限自有/授权环境）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.3",
    "requests==2.34.2",
    "beautifulsoup4==4.12.3",
    "pydantic==2.9.2",
    "typer==0.27.2",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
scan-lab = "scan_lab.cli:app"

[tool.setuptools]
packages = ["scan_lab", "scan_lab.plugins", "target"]
package-dir = { scan_lab = "src/scan_lab", target = "target" }

[tool.setuptools.package-data]
target = ["files/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
